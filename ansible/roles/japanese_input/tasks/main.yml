# GNOME 標準の IBus + Mozc を使う。入力ソースの切替は Super+Space (GNOME の既定)
- name: install japanese input packages
  apt:
    name:
      - ibus-mozc
    state: present

- name: remove fcitx5
  apt:
    name:
      - fcitx5
      - fcitx5-mozc
      - fcitx5-frontend-gtk3
      - fcitx5-frontend-gtk4
      - fcitx5-frontend-qt6
      - kde-config-fcitx5
    state: absent
