- name: detect Debian architecture
  command: dpkg --print-architecture
  check_mode: false
  register: third_party_apps_dpkg_arch
  changed_when: false

- name: gather installed packages
  package_facts:
    manager: apt

- name: validate TablePlus support on this Ubuntu version
  assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
      - ansible_facts.distribution_major_version in ["22", "24", "26"]
    fail_msg: "TablePlus role is supported only on Ubuntu 22.04 / 24.04 / 26.04."
  when: third_party_apps_enable_tableplus

# 旧バージョンの playbook が作成した .list 形式のリポジトリと鍵を削除
- name: remove legacy repository files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/google-chrome.list
    - /etc/apt/sources.list.d/vscode.list
    - /etc/apt/sources.list.d/tableplus.list
    - /etc/apt/sources.list.d/tableplus.list.disabled
    - /usr/share/keyrings/google-linux.gpg
    - /usr/share/keyrings/tableplus-archive.gpg

# Chrome / VS Code は公式 .deb の postinst が apt リポジトリ (.sources) を自前で管理する。
# Ansible は未インストール時の導入のみ担い、以降の更新は apt に任せる。
- name: install Google Chrome
  apt:
    deb: "https://dl.google.com/linux/direct/google-chrome-stable_current_{{ third_party_apps_dpkg_arch.stdout }}.deb"
  when:
    - third_party_apps_enable_chrome
    - "'google-chrome-stable' not in ansible_facts.packages"

- name: install VS Code
  apt:
    deb: "https://update.code.visualstudio.com/latest/linux-deb-{{ 'arm64' if third_party_apps_dpkg_arch.stdout == 'arm64' else 'x64' }}/stable"
  environment:
    DEBIAN_FRONTEND: noninteractive
  when:
    - third_party_apps_enable_vscode
    - "'code' not in ansible_facts.packages"

# リリースアップグレードで無効化された VS Code リポジトリを再有効化
- name: enable VS Code repository
  lineinfile:
    path: /etc/apt/sources.list.d/vscode.sources
    regexp: '^Enabled:\s*no'
    state: absent
  when: third_party_apps_enable_vscode

- name: add TablePlus repository
  deb822_repository:
    name: tableplus
    types: deb
    uris: "https://deb.tableplus.com/debian/{{ ansible_facts.distribution_major_version }}{{ '-arm' if third_party_apps_dpkg_arch.stdout == 'arm64' else '' }}"
    suites: tableplus
    components: main
    architectures: "{{ third_party_apps_dpkg_arch.stdout }}"
    signed_by: https://deb.tableplus.com/apt.tableplus.com.gpg.key
  when: third_party_apps_enable_tableplus

- name: install TablePlus
  apt:
    name: tableplus
    state: present
    update_cache: yes
  when: third_party_apps_enable_tableplus

- name: install Discord
  apt:
    deb: "{{ third_party_apps_discord_deb_url }}"
  when: third_party_apps_enable_discord

- name: install Obsidian
  apt:
    deb: "{{ third_party_apps_obsidian_deb_url }}"
  when: third_party_apps_enable_obsidian
