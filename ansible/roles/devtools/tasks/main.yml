- name: detect Debian architecture
  command: dpkg --print-architecture
  check_mode: false
  register: devtools_dpkg_arch
  changed_when: false

- name: remove legacy Docker repository files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.list.disabled
    - /usr/share/keyrings/docker.gpg

- name: add Docker repository
  deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ devtools_dpkg_arch.stdout }}"
    signed_by: https://download.docker.com/linux/ubuntu/gpg

- name: install Docker CE
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: add user to docker group
  user:
    name: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id, true) }}"
    groups: docker
    append: yes
