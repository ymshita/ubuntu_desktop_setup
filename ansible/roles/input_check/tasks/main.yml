# 注意: 以下の環境変数チェックは sudo 経由で実行されるため、
# 実際のデスクトップセッションの値は反映されない場合があります。
# あくまで sudo 環境下での値の確認用です。
- name: check session type
  shell: echo "${XDG_SESSION_TYPE:-}"
  register: session_type
  changed_when: false

- name: show session type
  debug:
    msg: "XDG_SESSION_TYPE = {{ session_type.stdout }}"

- name: check IM env GTK
  shell: echo "${GTK_IM_MODULE:-}"
  register: gtk_im
  changed_when: false

- name: check IM env QT
  shell: echo "${QT_IM_MODULE:-}"
  register: qt_im
  changed_when: false

- name: check XMODIFIERS
  shell: echo "${XMODIFIERS:-}"
  register: xmod
  changed_when: false

- name: determine desktop target user
  set_fact:
    input_check_target_user: "{{ ansible_facts.env.SUDO_USER | default(ansible_facts.user_id, true) }}"

- name: lookup desktop target user account
  getent:
    database: passwd
    key: "{{ input_check_target_user }}"

- name: set desktop target user home
  set_fact:
    input_check_target_home: "{{ ansible_facts.getent_passwd[input_check_target_user][4] }}"

- name: show IM envs
  debug:
    msg:
      - "GTK_IM_MODULE={{ gtk_im.stdout }}"
      - "QT_IM_MODULE={{ qt_im.stdout }}"
      - "XMODIFIERS={{ xmod.stdout }}"

- name: check fcitx5 packages
  shell: dpkg -l | grep -E 'fcitx5|mozc' || true
  register: fcitx5_pkgs
  changed_when: false

- name: show fcitx5 packages
  debug:
    msg: "{{ fcitx5_pkgs.stdout_lines }}"

- name: check KWin InputMethod setting
  shell: grep -E '^InputMethod=' "{{ input_check_target_home }}/.config/kwinrc" || true
  register: kwin_input_method
  changed_when: false

- name: show KWin InputMethod setting
  debug:
    msg: "{{ kwin_input_method.stdout | default('InputMethod is not configured', true) }}"
